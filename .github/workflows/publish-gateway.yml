name: Publish Gateway

on:
  push:
    branches: [publish]
    paths:
      - '.publish/transport/**'

permissions:
  contents: write
  actions: write

concurrency:
  group: publish-gateway
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve fixed transport slot
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff-tree --no-commit-id --name-status --no-renames -r "${GITHUB_SHA}")
          branches=()
          for entry in "${changed[@]}"; do
            status="${entry%%$'\t'*}"
            path="${entry#*$'\t'}"
            if [[ "${status}" =~ ^[AM]$ && "${path}" =~ ^\.publish/transport/(develop|temp)/[0-9]{4}\.b64$ ]]; then
              branch="${BASH_REMATCH[1]}"
              if [[ ! " ${branches[*]} " =~ " ${branch} " ]]; then
                branches+=("${branch}")
              fi
            elif [[ "${status}" == D && "${path}" == .publish/* ]]; then
              :
            else
              echo "Invalid publish transport change: ${status} ${path}" >&2
              exit 1
            fi
          done
          if [ "${#branches[@]}" -ne 1 ]; then
            echo "Expected exactly one active transport target, found ${#branches[@]}" >&2
            exit 1
          fi
          target="${branches[0]}"
          before="$(git rev-parse "refs/remotes/origin/${target}")"
          echo "TARGET_BRANCH=${target}" >> "$GITHUB_ENV"
          echo "TARGET_BEFORE=${before}" >> "$GITHUB_ENV"
          echo "TRANSPORT_DIR=.publish/transport/${target}" >> "$GITHUB_ENV"

      - name: Validate local transport and bundle
        shell: bash
        run: |
          set -euo pipefail
          python scripts/publish_gateway_validate.py

      - name: Publish exact target commit
        shell: bash
        run: |
          set -euo pipefail
          python scripts/publish_gateway_validate.py --verify-trusted-workflow
          git push origin "${PUBLISH_COMMIT}:refs/heads/${TARGET_BRANCH}"

      - name: Dispatch validation fixture build when its inputs changed
        if: env.TARGET_BRANCH == 'develop'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet "$TARGET_BEFORE" "$PUBLISH_COMMIT" -- \
            validation/real_game/renpy validation/real_game/fixture_runtime.py; then
            echo 'Validation fixture inputs unchanged; no fixture build requested.'
            exit 0
          fi
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/validation-fixture.yml/dispatches" \
            -f ref="${TARGET_BRANCH}"

      - name: Detect Process Loopback runtime asset change
        if: env.TARGET_BRANCH == 'develop'
        shell: bash
        run: |
          set -euo pipefail
          changed=false
          if ! git diff --quiet "$TARGET_BEFORE" "$PUBLISH_COMMIT" -- \
            integrations/windows-loopback/AutoAdv.ProcessLoopback.csproj \
            integrations/windows-loopback/Program.cs; then
            changed=true
          fi
          echo "RUNTIME_HELPER_CHANGED=${changed}" >> "$GITHUB_ENV"

      - uses: actions/setup-dotnet@v4
        if: env.TARGET_BRANCH == 'develop' && env.RUNTIME_HELPER_CHANGED == 'true'
        with:
          dotnet-version: '9.0.x'

      - name: Publish fixed Process Loopback runtime asset
        if: env.TARGET_BRANCH == 'develop' && env.RUNTIME_HELPER_CHANGED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          digest="$(python - <<'PY'
          import hashlib, os, subprocess
          digest = hashlib.sha256()
          for relative in (
              'integrations/windows-loopback/AutoAdv.ProcessLoopback.csproj',
              'integrations/windows-loopback/Program.cs',
          ):
              data = subprocess.check_output(['git', 'show', f"{os.environ['PUBLISH_COMMIT']}:{relative}"])
              digest.update(relative.encode('utf-8'))
              digest.update(b'\0')
              digest.update(data)
              digest.update(b'\0')
          print(digest.hexdigest())
          PY
          )"
          [[ "$digest" =~ ^[a-f0-9]{64}$ ]]
          base="AutoAdv.ProcessLoopback-${digest}-win-x64"
          source_root="${RUNNER_TEMP}/runtime-source"
          output="${RUNNER_TEMP}/runtime-output"
          mkdir -p "$source_root" "$output"
          git archive "$PUBLISH_COMMIT" integrations/windows-loopback | tar -x -C "$source_root"
          dotnet publish "$source_root/integrations/windows-loopback/AutoAdv.ProcessLoopback.csproj" \
            --configuration Release --nologo --runtime win-x64 --self-contained true \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:DebugType=None -p:DebugSymbols=false --output "$output"
          source="$output/AutoAdv.ProcessLoopback.exe"
          test -f "$source"
          asset="${RUNNER_TEMP}/${base}.exe"
          manifest="${RUNNER_TEMP}/${base}.json"
          cp "$source" "$asset"
          sha="$(sha256sum "$asset" | awk '{print $1}')"
          size="$(stat -c %s "$asset")"
          python - "$manifest" "$digest" "$(basename "$asset")" "$sha" "$size" <<'PY'
          import json, pathlib, sys
          path, digest, filename, sha, size = sys.argv[1:]
          pathlib.Path(path).write_text(json.dumps({
              'schema': 'autoadv-process-loopback-runtime-v1',
              'source_digest': digest,
              'filename': filename,
              'sha256': sha,
              'size_bytes': int(size),
          }, separators=(',', ':')), encoding='utf-8')
          PY
          tag='autoadv-runtime-assets'
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$PUBLISH_COMMIT" \
              --title 'AutoAdv managed Windows runtime assets' \
              --notes 'Machine-maintained fixed runtime assets used by the standard AutoAdv Windows runtime.'
          fi
          gh release upload "$tag" "$asset" "$manifest" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Dispatch Fast CI for published branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/dispatches" \
            -f ref="${TARGET_BRANCH}"
