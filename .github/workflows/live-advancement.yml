name: AutoAdv Live Advancement

on:
  pull_request:
    branches: [main]
    types: [edited]

permissions:
  contents: read

# Explicit PR title edit requests only this focused Windows game run.
# The game is consumed as a prebuilt fixture; RenPy construction is separate.
jobs:
  native-auto-advance:
    if: >-
      ${{ github.event.changes.title != null &&
          startsWith(github.event.pull_request.title, '[RUN AUTOADV LIVE]') &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.head.ref == 'develop' &&
          github.event.pull_request.base.ref == 'main' }}
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Install production GUI, Luna and real audio requirements
        run: python -m pip install '.[gui,native]'
      - name: Acquire prebuilt validation game matching this fixture source
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $digest = & python -m validation.real_game.fixture_runtime source-digest
          if ($LASTEXITCODE -ne 0 -or -not $digest) { throw 'Cannot calculate validation fixture source digest' }
          $asset = "autoadv-validation-game-$digest.zip"
          $download = Join-Path $env:RUNNER_TEMP $asset
          gh release download autoadv-validation-fixtures --repo $env:GITHUB_REPOSITORY `
            --pattern $asset --dir $env:RUNNER_TEMP --clobber
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $download)) {
              throw "No prebuilt validation game matches current fixture source: $digest"
          }
          $runtime = Join-Path $env:RUNNER_TEMP 'validation-game'
          Expand-Archive -LiteralPath $download -DestinationPath $runtime
          $game = & python -m validation.real_game.fixture_runtime verify --runtime $runtime
          if ($LASTEXITCODE -ne 0 -or -not $game) { throw 'Prebuilt validation game verification failed' }
          "AUTOADV_VALIDATION_GAME=$game" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build AutoAdv process-loopback product component
        shell: pwsh
        run: |
          dotnet build integrations/windows-loopback/AutoAdv.ProcessLoopback.csproj --configuration Release --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $helper = (Resolve-Path 'integrations/windows-loopback/bin/Release/net9.0-windows/AutoAdv.ProcessLoopback.dll').Path
          "AUTOADV_PROCESS_LOOPBACK=$helper" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Provision pinned ASR runtime for live audio path
        shell: pwsh
        run: |
          $modelRoot = & python -c 'from validation.real_game.prepare_asr_model import default_model_directory; print(default_model_directory())'
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve live-validation ASR cache' }
          python -m validation.real_game.prepare_asr_model --directory $modelRoot
          if ($LASTEXITCODE -ne 0) { throw 'Pinned live-validation ASR model unavailable' }
          "AUTOADV_VALIDATION_ASR_MODEL=$(Join-Path $modelRoot 'model.int8.onnx')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "AUTOADV_VALIDATION_ASR_TOKENS=$(Join-Path $modelRoot 'tokens.txt')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Check AutoAdv reading decision through actual Luna and Windows input
        shell: pwsh
        run: |
          & .\validation\real_game\run_live_check.ps1 -Phase reading `
            -GameExecutable $env:AUTOADV_VALIDATION_GAME -Automated `
            -Trace (Join-Path $env:RUNNER_TEMP 'autoadv-reading.jsonl') `
            -Report (Join-Path $env:RUNNER_TEMP 'autoadv-reading.result.json') `
            -TimeoutSeconds 120
      - name: Execute prebuilt game through actual Luna and AutoAdv GUI
        shell: pwsh
        run: |
          & .\validation\real_game\run_live_check.ps1 -Phase native `
            -GameExecutable $env:AUTOADV_VALIDATION_GAME -Automated `
            -ProcessLoopbackHelper $env:AUTOADV_PROCESS_LOOPBACK `
            -AsrModel $env:AUTOADV_VALIDATION_ASR_MODEL `
            -AsrTokens $env:AUTOADV_VALIDATION_ASR_TOKENS `
            -Trace (Join-Path $env:RUNNER_TEMP 'autoadv-native.jsonl') `
            -Report (Join-Path $env:RUNNER_TEMP 'autoadv-native.result.json') `
            -TimeoutSeconds 180
      - name: Preserve real game observations including failed runs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-native-advancement
          path: |
            ${{ runner.temp }}/autoadv-reading.jsonl
            ${{ runner.temp }}/autoadv-reading.result.json
            ${{ runner.temp }}/autoadv-native.jsonl
            ${{ runner.temp }}/autoadv-native.result.json
            ${{ runner.temp }}/autoadv-game-*.jsonl
          if-no-files-found: warn
          retention-days: 30
