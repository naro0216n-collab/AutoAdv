name: Real Audio Validation

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - 'validation/real_game/**'
      - 'autoadv/audio_buffer.py'
      - 'autoadv/audio_match.py'
      - 'autoadv/native_audio.py'
      - 'autoadv/validation_trace.py'
      - '.github/workflows/real-audio-validation.yml'

permissions:
  contents: read

jobs:
  recorded-audio:
    name: Recorded Japanese speech through AutoAdv native processing
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install native audio processing dependencies
        run: python -m pip install '.[native]'
      - name: Verify real WAV through native audio code, not game execution
        run: python -m unittest discover -s validation/real_game -p 'test_*.py' -v
