name: Real Audio Validation

on:
  pull_request:
    branches: [main]
    types: [reopened]

# Explicit draft PR reopening exercises the real ASR, not just VAD contracts.

permissions:
  contents: read

jobs:
  recorded-audio:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'develop' && github.event.pull_request.base.ref == 'main' }}
    name: Real Japanese recordings and evidence verifier contracts
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install production native audio dependencies
        run: python -m pip install '.[native]'
      - name: Verify real PCM fixtures and native activity contracts
        run: python -m unittest discover -s validation/real_game -p 'test_*.py' -v
      - name: Obtain and independently verify pinned SenseVoice for explicit real ASR run
        run: |
          python -m validation.real_game.prepare_asr_model
          python -m validation.real_game.prepare_asr_model --verify-only
      - name: Measure real production ASR accuracy and latency on recorded speech
        run: python -m validation.real_game.benchmark_asr --conditions clean quiet noise clipped truncated bgm --rounds 1 --output asr-benchmark.json
      - name: Measure real production ASR on nonlexical and competing voices
        run: python -m validation.real_game.stress_asr --selection all --rounds 1 --output asr-stress.json
      - name: Upload inference observations, not model or recorded audio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-asr-measurement
          path: |
            asr-benchmark.json
            asr-stress.json
          if-no-files-found: warn
          retention-days: 30
