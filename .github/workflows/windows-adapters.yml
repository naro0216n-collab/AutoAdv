name: Windows Adapter Validation

on:
  pull_request:
    branches: [main]
    types: [reopened]

# A nonmerging draft PR (develop -> main) is an explicit validation control.
# No heavy validation on routine develop pushes or PR creation.

permissions:
  contents: read

jobs:
  windows-adapters:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'develop' && github.event.pull_request.base.ref == 'main' }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Windows GUI, audio, OCR and native adapters
        run: python -m pip install '.[gui,audio,ocr,native]'
      - name: Run Windows-specific adapter contracts only
        run: >-
          python -m unittest
          tests.test_windows_input
          tests.test_running_target_selection
          tests.test_g2p_matching
          tests.test_native_runtime -v
      - name: Validate installed Windows adapter imports
        run: |
          python -c "import cv2, mss, numpy, sherpa_onnx, sounddevice; from PySide6.QtWidgets import QApplication; from autoadv.gui import run_gui; from autoadv.windows_input import WindowsAdvancementInput, key_message_parameters; from autoadv.g2p import HaqumeiG2P; assert HaqumeiG2P().candidates('えっ嘘でしょ。'); print('Windows adapters available')"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Build process-scoped audio loopback helper
        run: dotnet build integrations/windows-loopback/AutoAdv.ProcessLoopback.csproj --configuration Release --nologo
