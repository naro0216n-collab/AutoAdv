name: Windows Adapter Validation

on:
  push:
    branches: [develop]
    paths:
      - 'autoadv/**'
      - 'vendor/luna/**'
      - 'scripts/sync_luna_upstream.py'
      - 'docs/integration-spec.md'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/windows-adapters.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-adapters:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install GUI and audio transport dependencies
        run: python -m pip install '.[gui,audio]'
      - name: Verify Windows native ABI contract
        run: python -m unittest discover -s tests -p 'test_luna_abi_and_ipc.py' -v
      - name: Validate Windows GUI and input imports
        run: |
          python -c "from PySide6.QtWidgets import QApplication; from autoadv.gui import run_gui; from autoadv.windows_input import input_types; print('Windows adapters available')"
