name: Windows Adapter Validation

on:
  pull_request:
    branches: [main]
    types: [reopened]

# A nonmerging draft PR (develop -> main) is an explicit validation control.
# No heavy validation on routine develop pushes or PR creation.

permissions:
  contents: read

jobs:
  windows-adapters:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'develop' && github.event.pull_request.base.ref == 'main' }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Windows GUI, audio, OCR and native adapters
        run: python -m pip install '.[gui,audio,ocr,native]'
      - name: Run product and native boundary contracts on Windows
        run: python -m unittest discover -s tests -v
      - name: Validate Windows GUI and input imports
        run: |
          python -c "from PySide6.QtWidgets import QApplication; from autoadv.gui import run_gui; from autoadv.windows_input import input_types; print('Windows adapters available')"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Build process-scoped audio loopback helper
        run: dotnet build integrations/windows-loopback/AutoAdv.ProcessLoopback.csproj --configuration Release --nologo
