name: Windows Adapter Validation

on:
  workflow_run:
    workflows: ['Fast CI']
    types: [completed]
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-adapters:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.head_branch == 'develop' && github.event.workflow_run.conclusion == 'success') }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run points at the default branch unless explicitly pinned.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Build process-scoped WASAPI helper
        run: dotnet build integrations/windows-loopback/AutoAdv.ProcessLoopback.csproj -c Release
      - name: Install Windows audio/visual/model adapters
        run: |
          python -m pip install --upgrade pip
          python -m pip install '.[live]'
      - name: Verify full optional dependency test suite
        run: python -m unittest discover -s tests -v
      - name: Validate Windows adapter imports
        run: |
          python -c "import numpy,cv2,mss,webrtcvad,sherpa_onnx,sounddevice,psutil; from PySide6.QtWidgets import QApplication; from autoadv.gui import run_gui; from autoadv.live import LiveConfig; print('Windows adapter imports OK')"
