name: Retire temporary legacy branch

on:
  push:
    branches: [develop]

permissions:
  contents: write

jobs:
  retire-temp:
    if: ${{ github.event.head_commit.message == 'Retire obsolete temp branch after verified salvage' }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify frozen legacy ref and retire branch
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_TEMP: a9eb55612f072b4cfd8dd2461285faa477d1950c
        shell: bash
        run: |
          set -euo pipefail
          ref="repos/${GITHUB_REPOSITORY}/git/ref/heads/temp"
          actual="$(gh api "$ref" --jq '.object.sha')"
          test "$actual" = "$EXPECTED_TEMP"
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/temp"
