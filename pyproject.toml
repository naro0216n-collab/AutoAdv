[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autoadv"
version = "0.1.0.dev0"
description = "Safety-first LunaTranslator/native voice/TTS sync controller"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
luna = ["websockets>=13,<17"]
audio = ["sounddevice>=0.5,<1"]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["autoadv*"]