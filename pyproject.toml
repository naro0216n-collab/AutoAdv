[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autoadv"
version = "0.1.0.dev0"
description = "LunaHook dialogue acquisition, Irodori voice routing, and authorized conversation advancement"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
autoadv = "autoadv.__main__:main"

[project.gui-scripts]
autoadv-gui = "autoadv.gui:run_gui"

[project.optional-dependencies]
audio = ["sounddevice>=0.5,<1"]
dev = ["pytest>=8,<10"]
gui = ["PySide6>=6.8,<7"]

[tool.setuptools.packages.find]
include = ["autoadv*"]