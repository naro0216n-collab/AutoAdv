[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autoadv"
version = "0.1.0.dev0"
description = "Safety-first LunaTranslator/native voice/TTS sync controller"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
luna = ["websockets>=13,<17"]
audio = ["sounddevice>=0.5,<1"]
dev = ["pytest>=8,<10"]
live = ["psutil>=5.9,<9", "mss>=9,<12", "numpy>=2,<3", "opencv-python>=4.8,<5", "pytesseract>=0.3.13,<1", "webrtcvad-wheels>=2.0.14,<3", "sherpa-onnx>=1.10,<2", "sounddevice>=0.5,<1"]

[tool.setuptools.packages.find]
include = ["autoadv*"]